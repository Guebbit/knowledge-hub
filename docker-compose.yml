services:
  ollama:
    image: ollama/ollama:latest
    # how long Podman waits before forcing shutdown with SIGKILL; adjust if you have very large models that need more time to unload
    # Default is SIGTERM which is graceful but may hang
    stop_signal: SIGKILL
    stop_grace_period: 5s
    ports:
      - '${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}'
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      # Limit threads so the host stays responsive; tune to taste
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-1}
      # Keep models loaded for 5 minutes after the last request
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # Global context length for all models, from OLLAMA_NUM_CTX in .env.
      # OLLAMA_CONTEXT_LENGTH is the variable the Ollama server actually reads
      # (it ignores OLLAMA_NUM_CTX, and would fall back to its own VRAM-based
      # default). The same .env value is handed to the scripts container so
      # 2repo budgets its prompts against the window the server really runs.
      # Safe for 24 GB VRAM (RTX 4090) with 8B–14B models.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-32000}
    volumes:
      # Shared model cache — host path so models survive container rebuilds.
      # Treat as read-only from the host; writes happen inside the container.
      - /home/${LINUX_USERNAME}/.ollama:/root/.ollama:z,rw
      # Container-specific temp / cache
      - ollama-data:/root/.ollama-data:rw,Z,rprivate
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nvidia-smi || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits — adjust to your hardware (machine has 32 GB RAM / 16 cores)
    mem_limit: ${OLLAMA_MEM_LIMIT:-16g}
    shm_size: ${OLLAMA_SHM_SIZE:-8g}
    cpus: '${OLLAMA_CPUS:-8.0}'
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable


  scripts:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    # No persistent container — invoked via: docker compose run --rm scripts python /scripts/main.py ...
    # The 2brain.sh wrapper handles this automatically.
    volumes:
      - ./vault:/vault:rw
      - ./scripts:/scripts:ro
      - /home/${LINUX_USERNAME}/.models:/models:z,rw
      # Custom graphify provider forcing Ollama's JSON-mode via the OpenAI
      # "response_format" field (the native "format" key is ignored by the
      # /v1 endpoint) so local models can't return prose instead of the
      # requested graph JSON — see graphify/providers.json. Mounted at graphify's trusted
      # global path (~/.graphify == /root/.graphify, container has no other
      # user); read-only since the container never needs to write it.
      - ./graphify/providers.json:/root/.graphify/providers.json:ro
      # Claude Code CLI auth (backs graphify's "claude-cli" backend, used by
      # a claude-code:* preset) — reuses your host Claude Code subscription
      # login instead of a metered ANTHROPIC_API_KEY. Read-only: the
      # container authenticates with these, never writes to them.
      - /home/${LINUX_USERNAME}/.claude.json:/root/.claude.json:ro
      - /home/${LINUX_USERNAME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
    environment:
      VAULT_PATH: /vault
      MODELS_PATH: /models
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      # Graphify requires a non-empty value when OLLAMA_BASE_URL points to a
      # non-localhost host (docker service name). Ollama ignores auth entirely.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-local}
      # Must equal the ollama service's OLLAMA_CONTEXT_LENGTH above: 2repo arch
      # uses it to keep CodeBoarding's prompts inside the server's real window.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32000}
      DEFAULT_PRESET: ${DEFAULT_PRESET:-fast}
      PRESET_FAST: ${PRESET_FAST:-ollama:qwen3:8b}
      PRESET_DEEP: ${PRESET_DEEP:-openai:gpt-4o}
      PRESET_COPILOT: ${PRESET_COPILOT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # GitHub Copilot CLI auth (backs a copilot-cli:* preset) — a fine-grained
      # PAT with the account-level "Copilot Requests" permission. Draws on the
      # Copilot plan's request allowance instead of a metered API key.
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      COPILOT_CLI_TIMEOUT: ${COPILOT_CLI_TIMEOUT:-600}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      REPO_PRESET_GRAPH: ${REPO_PRESET_GRAPH:-deep}
      REPO_PRESET_WIKI: ${REPO_PRESET_WIKI:-}
      REPO_PRESET_ARCH: ${REPO_PRESET_ARCH:-}
      REPO_ARCH_AGENT_TIMEOUT: ${REPO_ARCH_AGENT_TIMEOUT:-}
      REPO_ARCH_CONTEXT_TOKENS: ${REPO_ARCH_CONTEXT_TOKENS:-}
      REPO_AI_TARGET: ${REPO_AI_TARGET:-}
      REPO_STALE_THRESHOLD: ${REPO_STALE_THRESHOLD:-5}
      REPO_WIKI_AUTO: ${REPO_WIKI_AUTO:-}
    depends_on:
      - ollama


volumes:
  ollama-data:
    driver: local